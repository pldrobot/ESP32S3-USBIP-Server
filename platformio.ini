; =============================================================
; ESP32-S3 USB/IP Bridge - PlatformIO Configuration
; Boards: ESP32-S3-N16R8 DevKitC-1 (esp32s3*) and ESP32-S3 Super Mini (esp32s3mini*)
;
; Before building: copy .env.template to .env and fill in your values.
; The pre-build script (tools/load_env.py) reads .env and generates
; src/config_env.h automatically on every 'pio run'.
; =============================================================

; ── Shared settings inherited by every environment ────────────────────────────
[common]
platform  = espressif32
framework = arduino

; CRITICAL: USB OTG Host mode — required for USB printer driver.
; Without these the USB-C port acts as CDC serial, not USB Host.
; NOTE: on the Super Mini this is its only USB port, so after the first flash
; it cannot be used for serial upload — use the OTA environment, or hold BOOT
; while plugging in to re-enter the ROM bootloader.
build_unflags =
    -DARDUINO_USB_MODE
    -DARDUINO_USB_CDC_ON_BOOT

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    https://github.com/pldrobot/EspUsbIpServer.git

; Reads .env and generates src/config_env.h before every build
extra_scripts = pre:tools/load_env.py

; ── Board profiles ────────────────────────────────────────────────────────────
[board_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = partitions_ota16mb.csv
board_build.filesystem          = littlefs

; ESP32-S3FH4R2: 4MB flash, 2MB quad PSRAM. Onboard LED is a WS2812 on GPIO48.
; custom_led_pin overrides LED_PIN from .env; LED_RGB makes main.cpp drive it as NeoPixel.
[board_supermini]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size         = 4MB
board_build.flash_size          = 4MB
board_build.partitions          = partitions_ota4mb.csv
board_build.filesystem          = littlefs
custom_led_pin                  = 48
build_flags =
    ${common.build_flags}
    -DLED_RGB

; ── ESP32-S3-N16R8: USB upload ────────────────────────────────────────────────
[env:esp32s3]
extends       = common, board_n16r8
; upload_port = COM13        ; <-- set your USB serial port (e.g. COM3, /dev/ttyUSB0)
upload_speed  = 921600
; monitor_port = COM13       ; <-- same port as upload_port
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

; ── ESP32-S3-N16R8: OTA upload ──────────────────────────
; upload_port and --auth are injected automatically from .env by tools/load_env.py
[env:esp32s3_ota]
extends         = common, board_n16r8
upload_protocol = espota
monitor_speed   = 115200

; ── ESP32-S3 Super Mini: USB upload (first flash; hold BOOT while plugging in) ─
[env:esp32s3mini]
extends       = common, board_supermini
upload_speed  = 921600
monitor_speed = 115200

; ── ESP32-S3 Super Mini: OTA upload ───────────────────────────────────────────
[env:esp32s3mini_ota]
extends         = common, board_supermini
upload_protocol = espota
monitor_speed   = 115200
